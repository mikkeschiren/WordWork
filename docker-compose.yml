services:
  word-work:
    build: .
    image: word-work:dev
    container_name: word-work
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${WW_DATA_PATH:-./data}:/data
    environment:
      WW_SNAPSHOT_MINUTES: ${WW_SNAPSHOT_MINUTES:-5}
      WW_ALLOWED_HOSTS: ${WW_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      # Alla värden kan sättas i .env bredvid den här filen (se .env.example).
      WW_AI_API: ${WW_AI_API:-ollama}
      WW_AI_URL: ${WW_AI_URL:-http://host.docker.internal:11434}
      WW_AI_MODEL: ${WW_AI_MODEL:-${WW_OLLAMA_MODEL:-}}
      # API-nyckel för tjänster som kräver det.
      WW_AI_KEY: ${WW_AI_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
